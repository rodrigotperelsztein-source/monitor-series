name: Actualizar series

# Seguridad:
#   - Las acciones de terceros están fijadas por su commit (no por etiqueta, que se puede mover).
#   - Las dependencias de Python se instalan solo si coinciden con su huella (requirements.txt).
#   - El paso que baja y procesa archivos de afuera corre SIN credenciales: el token de GitHub
#     solo está disponible en el último paso, que guarda data/ y nada más.

on:
  schedule:
    # Días hábiles, ventana de publicación de INDEC (horas en UTC; Buenos Aires = UTC-3).
    # INDEC publica a las 16:00 y a esa hora la página suele saturarse, sobre todo los días
    # del IPC: el primer intento es a las 16:40 y se reintenta cada media hora hasta las 18:40.
    # Estas corridas solo bajan las fuentes que el calendario prevé para ese día.
    - cron: "40 19 * * 1-5"   # 16:40
    - cron: "10 20 * * 1-5"   # 17:10
    - cron: "40 20 * * 1-5"   # 17:40
    - cron: "10 21 * * 1-5"   # 18:10
    - cron: "40 21 * * 1-5"   # 18:40
    # Control completo todas las noches a las 21:47: actualiza el calendario, revisa todas
    # las fuentes (atrapa revisiones y publicaciones fuera de calendario) y termina en error
    # si una publicación prevista para hoy no entró.
    - cron: "47 0 * * *"
    # Días hábiles a las 10:10: cierre del día anterior del Brent, el WTI, las naftas y el gasoil (la EIA lo publica
    # entre las 8:30 y las 9:30 de Buenos Aires). Solo baja esa fuente.
    - cron: "10 13 * * 1-5"
  workflow_dispatch:
    inputs:
      modo:
        description: "completo: calendario y todas las fuentes; calendario: solo lo que se publica hoy"
        type: choice
        options: [completo, calendario]
        default: completo
      forzar:
        description: "Procesar aunque el archivo no haya cambiado"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: actualizar-series
  cancel-in-progress: false

jobs:
  actualizar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Instalar dependencias (verificadas por huella)
        run: "pip install --require-hashes --only-binary=:all: --no-cache-dir -r requirements.txt"

      - name: Bajar, validar y procesar
        env:
          EVENTO: ${{ github.event_name }}
          HORARIO: ${{ github.event.schedule }}
          MODO_MANUAL: ${{ inputs.modo }}
          FORZAR: ${{ inputs.forzar && '--forzar' || '' }}
        run: |
          if [ "$EVENTO" = "workflow_dispatch" ]; then
            MODO="$MODO_MANUAL"
          elif [ "$HORARIO" = "47 0 * * *" ]; then
            MODO=completo
          elif [ "$HORARIO" = "10 13 * * 1-5" ]; then
            MODO=completo
            FUENTES="petroleo refinados"
          else
            MODO=calendario
          fi
          case "$MODO" in completo|calendario) ;; *) echo "Modo inválido"; exit 1;; esac
          echo "Modo: $MODO"
          # La salida queda también en data/ultima_corrida.txt, para verla sin entrar a Actions.
          python -m pipeline.actualizar --modo "$MODO" $FORZAR ${FUENTES:-} 2>&1 | tee data/ultima_corrida.txt
          exit "${PIPESTATUS[0]}"

      - name: Guardar cambios en el repositorio (solo data/)
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios para guardar."
            exit 0
          fi
          # Nada fuera de data/ puede entrar en este commit.
          if git diff --cached --name-only | grep -v '^data/'; then
            echo "Hay cambios fuera de data/: no se guardan."; exit 1
          fi
          git commit -m "Datos actualizados $(TZ=America/Argentina/Buenos_Aires date +%Y-%m-%d)"
          REMOTO="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git pull --rebase "$REMOTO" main
          git push "$REMOTO" HEAD:main
