name: Actualizar series

# Seguridad:
#   - Las acciones de terceros están fijadas por su commit (no por etiqueta, que se puede mover).
#   - Las dependencias de Python se instalan solo si coinciden con su huella (requirements.txt).
#   - El paso que baja y procesa archivos de afuera corre SIN credenciales: el token de GitHub
#     solo está disponible en el último paso, que guarda data/ y nada más.

on:
  schedule:
    # Horas en UTC (Buenos Aires = UTC-3). GitHub no garantiza el horario de las tareas
    # programadas: con carga alta las demora horas o las saltea, sobre todo en horas redondas.
    # Por eso hay varios horarios, en minutos poco usados; si una corrida no tiene nada que
    # hacer termina en segundos y no guarda nada.
    #
    # Días hábiles, ventana de publicación de INDEC (publica a las 16:00): de 16:23 a 20:37,
    # cada 15 a 25 minutos. Solo bajan las fuentes que el calendario prevé para ese día y que
    # todavía no entraron.
    - cron: "23 19 * * 1-5"   # 16:23
    - cron: "41 19 * * 1-5"   # 16:41
    - cron: "57 19 * * 1-5"   # 16:57
    - cron: "13 20 * * 1-5"   # 17:13
    - cron: "29 20 * * 1-5"   # 17:29
    - cron: "46 20 * * 1-5"   # 17:46
    - cron: "7 21 * * 1-5"    # 18:07
    - cron: "26 21 * * 1-5"   # 18:26
    - cron: "52 21 * * 1-5"   # 18:52
    - cron: "18 22 * * 1-5"   # 19:18
    - cron: "44 22 * * 1-5"   # 19:44
    - cron: "11 23 * * 1-5"   # 20:11
    - cron: "37 23 * * 1-5"   # 20:37
    # Control completo todas las noches: actualiza el calendario, revisa todas las fuentes
    # (atrapa revisiones y publicaciones fuera de calendario) y termina en error si una
    # publicación prevista no entró. Dos horarios (21:47 y 01:17) por si uno se demora.
    - cron: "47 0 * * *"      # 21:47
    - cron: "17 4 * * *"      # 01:17
    # Días hábiles por la mañana: cierre del día anterior del Brent, el WTI, las naftas y el
    # gasoil (la EIA lo publica entre las 8:30 y las 9:30). Solo bajan esas fuentes.
    - cron: "12 13 * * 1-5"   # 10:12
    - cron: "38 14 * * 1-5"   # 11:38
    - cron: "19 16 * * 1-5"   # 13:19
  workflow_dispatch:
    inputs:
      modo:
        description: "completo: calendario y todas las fuentes; calendario: solo lo que se publica hoy"
        type: choice
        options: [completo, calendario]
        default: completo
      forzar:
        description: "Procesar aunque el archivo no haya cambiado"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: actualizar-series
  cancel-in-progress: false

jobs:
  actualizar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Instalar dependencias (verificadas por huella)
        run: "pip install --require-hashes --only-binary=:all: --no-cache-dir -r requirements.txt"

      - name: Bajar, validar y procesar
        id: proc
        env:
          EVENTO: ${{ github.event_name }}
          HORARIO: ${{ github.event.schedule }}
          MODO_MANUAL: ${{ inputs.modo }}
          FORZAR: ${{ inputs.forzar && '--forzar' || '' }}
        run: |
          if [ "$EVENTO" = "workflow_dispatch" ]; then
            MODO="$MODO_MANUAL"
          else
            case "$HORARIO" in
              "47 0 * * *"|"17 4 * * *") MODO=completo ;;
              "12 13 * * 1-5"|"38 14 * * 1-5"|"19 16 * * 1-5") MODO=completo; FUENTES="petroleo refinados" ;;
              *) MODO=calendario ;;
            esac
          fi
          case "$MODO" in completo|calendario) ;; *) echo "Modo inválido"; exit 1;; esac
          echo "Modo: $MODO"
          # La salida queda también en data/ultima_corrida.txt, para verla sin entrar a Actions.
          python -m pipeline.actualizar --modo "$MODO" $FORZAR ${FUENTES:-} 2>&1 | tee data/ultima_corrida.txt
          exit "${PIPESTATUS[0]}"

      - name: Guardar cambios en el repositorio (solo data/)
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULTADO: ${{ steps.proc.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          # Si la corrida salió bien y lo único que cambió es su registro, no se guarda (evita un
          # commit por cada corrida sin novedades). Si hubo un error, el registro sí se guarda.
          if [ "$RESULTADO" = "success" ] && git diff --cached --quiet -- . ':(exclude)data/ultima_corrida.txt'; then
            echo "Sin cambios para guardar."
            exit 0
          fi
          # Nada fuera de data/ puede entrar en este commit.
          if git diff --cached --name-only | grep -v '^data/'; then
            echo "Hay cambios fuera de data/: no se guardan."; exit 1
          fi
          git commit -m "Datos actualizados $(TZ=America/Argentina/Buenos_Aires date +%Y-%m-%d)"
          REMOTO="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git pull --rebase "$REMOTO" main
          git push "$REMOTO" HEAD:main
