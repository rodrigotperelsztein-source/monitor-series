name: Actualizar series

on:
  schedule:
    # Días hábiles, ventana de publicación de INDEC (horas en UTC; Buenos Aires = UTC-3).
    # INDEC publica a las 16:00 y a esa hora la página suele saturarse, sobre todo los días
    # del IPC: el primer intento es a las 16:40 y se reintenta cada media hora hasta las 18:40.
    # Estas corridas solo bajan las fuentes que el calendario prevé para ese día.
    - cron: "40 19 * * 1-5"   # 16:40
    - cron: "10 20 * * 1-5"   # 17:10
    - cron: "40 20 * * 1-5"   # 17:40
    - cron: "10 21 * * 1-5"   # 18:10
    - cron: "40 21 * * 1-5"   # 18:40
    # Control completo todas las noches a las 21:47: actualiza el calendario, revisa todas
    # las fuentes (atrapa revisiones y publicaciones fuera de calendario) y termina en error
    # si una publicación prevista para hoy no entró.
    - cron: "47 0 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "completo: calendario y todas las fuentes; calendario: solo lo que se publica hoy"
        type: choice
        options: [completo, calendario]
        default: completo
      forzar:
        description: "Procesar aunque el archivo no haya cambiado"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: actualizar-series
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Bajar, validar y procesar
        env:
          EVENTO: ${{ github.event_name }}
          HORARIO: ${{ github.event.schedule }}
          MODO_MANUAL: ${{ inputs.modo }}
          FORZAR: ${{ inputs.forzar && '--forzar' || '' }}
        run: |
          if [ "$EVENTO" = "workflow_dispatch" ]; then
            MODO="$MODO_MANUAL"
          elif [ "$HORARIO" = "47 0 * * *" ]; then
            MODO=completo
          else
            MODO=calendario
          fi
          echo "Modo: $MODO"
          # La salida queda también en data/ultima_corrida.txt, para verla sin entrar a Actions.
          python -m pipeline.actualizar --modo "$MODO" $FORZAR 2>&1 | tee data/ultima_corrida.txt
          exit "${PIPESTATUS[0]}"

      - name: Guardar cambios en el repositorio
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios para guardar."
          else
            git commit -m "Datos actualizados $(TZ=America/Argentina/Buenos_Aires date +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
