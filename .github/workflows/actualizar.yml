name: Actualizar series

# Seguridad:
#   - Las acciones de terceros están fijadas por su commit (no por etiqueta, que se puede mover).
#   - Las dependencias de Python se instalan solo si coinciden con su huella (requirements.txt).
#   - El paso que baja y procesa archivos de afuera corre SIN credenciales: el token de GitHub
#     solo está disponible en el último paso, que guarda data/ y nada más.
#   - El token de la API del INDEC solo llega al paso que baja esas tablas (no procesa nada).

on:
  schedule:
    # Horas en UTC (Buenos Aires = UTC-3). GitHub no garantiza el horario de las tareas programadas: en noviembre
    # de 2026 las de este repositorio arrancaron entre 5 y 7 horas después de lo pedido, todos los días. Por eso los
    # horarios no apuntan a una hora exacta: cubren una franja ancha, y cada corrida decide qué hacer según el
    # calendario y lo que ya está guardado. Si no hay nada que hacer, termina en segundos y no guarda nada.
    #
    # Días hábiles, de las 9:07 a las 20:47 de Buenos Aires, cada 20 minutos: baja solo las fuentes que el
    # calendario del INDEC prevé para ese día y que todavía no entraron (INDEC publica a las 16:00). Las primeras
    # horas están para que, con la demora de GitHub, haya corridas que caigan justo después de las 16.
    - cron: "7,27,47 12-23 * * 1-5"
    # Control completo todas las noches: actualiza el calendario, revisa todas las fuentes (atrapa revisiones y
    # publicaciones fuera de calendario), controla atrasos y termina en error si una publicación prevista no entró.
    # Dos horarios (21:47 y 01:17) por si uno se demora.
    - cron: "47 0 * * *"      # 21:47
    - cron: "17 4 * * *"      # 01:17
    # Días hábiles: cierre del día anterior del Brent, el WTI, las naftas y el gasoil (la EIA lo publica entre las
    # 8:30 y las 9:30 de Buenos Aires). Solo bajan esas fuentes. Los dos primeros horarios compensan la demora.
    - cron: "12 6 * * 1-5"    # 03:12 (con la demora, cae a media mañana)
    - cron: "38 8 * * 1-5"    # 05:38
    - cron: "12 13 * * 1-5"   # 10:12
    - cron: "38 14 * * 1-5"   # 11:38
    - cron: "19 16 * * 1-5"   # 13:19
  workflow_dispatch:
    inputs:
      modo:
        description: "completo: calendario y todas las fuentes; calendario: solo lo que se publica hoy"
        type: choice
        options: [completo, calendario]
        default: completo
      fuentes:
        description: "Solo estas fuentes (ids separados por espacio; vacío = según el modo)"
        required: false
        default: ""
      historia_indec:
        description: "Año desde el que se baja el comercio exterior de la API del INDEC (vacío = últimos dos años)"
        required: false
        default: ""
      forzar:
        description: "Procesar aunque el archivo no haya cambiado"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: actualizar-series
  cancel-in-progress: false

jobs:
  actualizar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Instalar dependencias (verificadas por huella)
        run: "pip install --require-hashes --only-binary=:all: --no-cache-dir -r requirements.txt"

      - name: Elegir modo y fuentes
        id: modo
        env:
          EVENTO: ${{ github.event_name }}
          HORARIO: ${{ github.event.schedule }}
          MODO_MANUAL: ${{ inputs.modo }}
          FUENTES_MANUAL: ${{ inputs.fuentes }}
        run: |
          FUENTES=""
          if [ "$EVENTO" = "workflow_dispatch" ]; then
            MODO="$MODO_MANUAL"
            case "$FUENTES_MANUAL" in *[!a-z0-9_\ ]*) echo "Lista de fuentes inválida"; exit 1;; esac
            FUENTES="$FUENTES_MANUAL"
          else
            case "$HORARIO" in
              "47 0 * * *"|"17 4 * * *") MODO=completo ;;
              "12 6 * * 1-5"|"38 8 * * 1-5"|"12 13 * * 1-5"|"38 14 * * 1-5"|"19 16 * * 1-5")
                MODO=completo; FUENTES="petroleo refinados" ;;
              *) MODO=calendario ;;
            esac
          fi
          case "$MODO" in completo|calendario) ;; *) echo "Modo inválido"; exit 1;; esac
          TABLAS=$(python -m pipeline.actualizar --modo "$MODO" --tablas-api $FUENTES)
          case "$TABLAS" in *[!a-z0-9_\ -]*) echo "Lista de tablas inválida"; exit 1;; esac
          echo "Modo: $MODO; fuentes: ${FUENTES:-todas}; tablas de la API del INDEC: ${TABLAS:-ninguna}"
          { echo "modo=$MODO"; echo "fuentes=$FUENTES"; echo "tablas=$TABLAS"; } >> "$GITHUB_OUTPUT"

      # Único paso con el token del INDEC (secreto INDEC_API_TOKEN): solo baja tablas de https://api.indec.gob.ar
      # a api_indec/ (fuera de data/, no se guarda en el repositorio). Si falla (token vencido, API caída), las
      # fuentes de INDEC usan el archivo de siempre del sitio y la corrida sigue.
      - name: Bajar tablas de la API del INDEC
        if: steps.modo.outputs.tablas != ''
        continue-on-error: true
        env:
          INDEC_API_TOKEN: ${{ secrets.INDEC_API_TOKEN }}
          TABLAS: ${{ steps.modo.outputs.tablas }}
          INDEC_API_ANIO_DESDE: ${{ inputs.historia_indec }}
        run: python -m pipeline.indec_api bajar $TABLAS

      - name: Bajar, validar y procesar
        id: proc
        env:
          MODO: ${{ steps.modo.outputs.modo }}
          FUENTES: ${{ steps.modo.outputs.fuentes }}
          PYTHONWARNINGS: "ignore::UserWarning:openpyxl.reader.workbook"  # avisos de formato de planillas ajenas
          FORZAR: ${{ inputs.forzar && '--forzar' || '' }}
        run: |
          # La salida queda también en data/ultima_corrida.txt, para verla sin entrar a Actions.
          # -u: la salida aparece a medida que avanza (sirve para ver dónde se demora).
          python -u -m pipeline.actualizar --modo "$MODO" $FORZAR $FUENTES 2>&1 | tee data/ultima_corrida.txt
          exit "${PIPESTATUS[0]}"

      - name: Guardar cambios en el repositorio (solo data/)
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULTADO: ${{ steps.proc.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          # Si la corrida salió bien y lo único que cambió es su registro, no se guarda (evita un
          # commit por cada corrida sin novedades). Si hubo un error, el registro sí se guarda.
          if [ "$RESULTADO" = "success" ] && git diff --cached --quiet -- . ':(exclude)data/ultima_corrida.txt'; then
            echo "Sin cambios para guardar."
            exit 0
          fi
          # Nada fuera de data/ puede entrar en este commit.
          if git diff --cached --name-only | grep -v '^data/'; then
            echo "Hay cambios fuera de data/: no se guardan."; exit 1
          fi
          git commit -m "Datos actualizados $(TZ=America/Argentina/Buenos_Aires date +%Y-%m-%d)"
          REMOTO="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git pull --rebase "$REMOTO" main
          git push "$REMOTO" HEAD:main
