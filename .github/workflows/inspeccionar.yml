name: Inspeccionar archivo de origen

# Herramienta para sumar fuentes nuevas: baja uno o más archivos (solo https) y deja la
# descripción de su estructura en la rama "inspeccion" (no toca main). Solo la pueden correr
# quienes tienen permiso de escritura en el repositorio. El paso que baja los archivos corre
# sin credenciales.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URLs https separadas por espacio"
        required: false
        default: ""
      indec_api:
        description: "API del INDEC (usa el secreto INDEC_API_TOKEN): no, muestra (60 filas por tabla) o completo"
        type: choice
        options: ["no", muestra, completo]
        default: "no"

permissions: {}

jobs:
  inspeccionar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: "pip install --require-hashes --only-binary=:all: --no-cache-dir -r requirements.txt"
      - name: Muestra de la API del INDEC (único paso con el token del INDEC; solo descarga)
        if: inputs.indec_api == 'muestra' || inputs.indec_api == 'completo'
        env:
          INDEC_API_TOKEN: ${{ secrets.INDEC_API_TOKEN }}
          MODO: ${{ inputs.indec_api }}
        run: python -m pipeline.indec_api "$MODO"
      - name: Describir archivos
        if: inputs.urls != ''
        env:
          URLS: ${{ inputs.urls }}
        run: |
          set -f  # sin expansión de comodines en las URLs
          python -m pipeline.inspeccionar $URLS
      - name: Publicar en la rama inspeccion
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B inspeccion
          git add -f inspeccion
          git commit -m "Inspección $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" inspeccion
