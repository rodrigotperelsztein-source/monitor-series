name: Pruebas

# Controles que no tocan la red: registro de fuentes, lógica del proceso y reglas de seguridad
# (ver tests/ y SECURITY.md). Corren en cada cambio del código, no en las corridas de datos.

on:
  push:
    branches: [main]
    paths: ["pipeline/**", "tests/**", "docs/**", ".github/workflows/**", "requirements.txt"]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: "pip install --require-hashes --only-binary=:all: --no-cache-dir -r requirements.txt"
      - run: python -m unittest discover -s tests -v
