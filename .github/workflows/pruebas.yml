name: Pruebas

# Controles que no tocan la red: registro de fuentes, lógica del proceso y reglas de seguridad
# (ver tests/ y SECURITY.md). Corren en cada cambio del código, no en las corridas de datos.

on:
  push:
    branches: [main]
    paths: ["pipeline/**", "tests/**", "docs/**", ".github/workflows/**", "requirements.txt"]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: "pip install --require-hashes --only-binary=:all: --no-cache-dir -r requirements.txt"
      - run: python -m unittest discover -s tests -v
